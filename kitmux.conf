# kitmux overlay config (split-keys variant). The kitmux launcher passes this
# file to its kitty instance after the user's kitty.conf, so these maps win.
#
# Every map is guarded with --when-focus-on:
#   var:kitmux_target   the focused window is a kitmux tab (a tmux client)
#   var:kitmux_overlay  the focused window is a kitmux overlay (confirm, scrollback)
# Plain kitty tabs in the same instance match neither and keep the user's keys.
#
# kitmux_bg and kitmux_overlay are action aliases the launcher defines with -o.
# They expand to `launch --type=background|overlay -- /path/to/kitmux`, and
# kitty replaces @active-kitty-window-id with the id of the focused window.
#
# kitty_mod is cmd on macOS and ctrl+shift on Linux (set in the user's config),
# so kitty_mod+shift+X is cmd+shift+X on macOS and collapses to ctrl+shift+X on
# Linux. Chords that differ between the two live in kitmux-<os>.conf.

# New tab: new tmux window in $HOME of the focused tab's target.
map --when-focus-on var:kitmux_target --allow-fallback=shifted,ascii kitty_mod+t kitmux_bg _newtab @active-kitty-window-id

# Split side by side (the new pane starts in the focused pane's directory;
# kitty_mod+shift+d, stacked, is bound in kitmux-<os>.conf).
map --when-focus-on var:kitmux_target --allow-fallback=shifted,ascii kitty_mod+d kitmux_bg _split h @active-kitty-window-id

# Next / previous split.
map --when-focus-on var:kitmux_target kitty_mod+shift+right kitmux_bg _pane next @active-kitty-window-id
map --when-focus-on var:kitmux_target kitty_mod+shift+left  kitmux_bg _pane prev @active-kitty-window-id

# Close split: asks, then kills the active tmux pane.
map --when-focus-on var:kitmux_target --allow-fallback=shifted,ascii kitty_mod+w kitmux_overlay _confirm pane @active-kitty-window-id

# Scrollback of the active tmux pane in a pager.
map --when-focus-on var:kitmux_target --allow-fallback=shifted,ascii kitty_mod+h kitmux_overlay _scrollback @active-kitty-window-id

# Copy the output of the last command of the active tmux pane to the local
# clipboard. The key is in kitmux-<os>.conf (cmd+shift+c on macOS, ctrl+shift+y
# on Linux), the user's keys for kitty's @last_cmd_output. It needs OSC 133
# marks from the shell inside tmux, see the README.

# Close tab: asks, then kills the tmux window. With the user's current config
# no close_tab chord is left to take over (kitty's defaults for it, kitty_mod+q
# everywhere and cmd+w on macOS, are both rebound there), so nothing is mapped.
# To bind one, copy this line with a chord of your choice:
# map --when-focus-on var:kitmux_target --allow-fallback=shifted,ascii kitty_mod+shift+w kitmux_overlay _confirm window @active-kitty-window-id

# Inside a kitmux overlay the close key closes the overlay (which cancels a
# confirmation), and the other kitmux keys do nothing instead of falling back
# to kitty's own split and tab actions inside a tmux tab.
map --when-focus-on var:kitmux_overlay --allow-fallback=shifted,ascii kitty_mod+w close_window
map --when-focus-on var:kitmux_overlay --allow-fallback=shifted,ascii kitty_mod+t discard_event
map --when-focus-on var:kitmux_overlay --allow-fallback=shifted,ascii kitty_mod+d discard_event
map --when-focus-on var:kitmux_overlay --allow-fallback=shifted,ascii kitty_mod+h discard_event
map --when-focus-on var:kitmux_overlay kitty_mod+shift+right discard_event
map --when-focus-on var:kitmux_overlay kitty_mod+shift+left  discard_event

include kitmux-${KITTY_OS}.conf
