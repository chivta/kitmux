# kitmux keys that exist only on Linux. Included by kitmux.conf.

# Split stacked.
map --when-focus-on var:kitmux_target --allow-fallback=shifted,ascii ctrl+alt+d kitmux_bg _split v @active-kitty-window-id
map --when-focus-on var:kitmux_overlay --allow-fallback=shifted,ascii ctrl+alt+d discard_event

# Copy the last command's output, replacing the user's ctrl+shift+y in kitmux
# tabs (kitty's @last_cmd_output finds nothing inside tmux).
map --when-focus-on var:kitmux_target --allow-fallback=shifted,ascii ctrl+shift+y kitmux_bg _copylast @active-kitty-window-id
map --when-focus-on var:kitmux_overlay --allow-fallback=shifted,ascii ctrl+shift+y discard_event
