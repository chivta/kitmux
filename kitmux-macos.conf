# kitmux keys that exist only on macOS. Included by kitmux.conf.

# Split stacked.
map --when-focus-on var:kitmux_target --allow-fallback=shifted,ascii cmd+shift+d kitmux_bg _split v @active-kitty-window-id
map --when-focus-on var:kitmux_overlay --allow-fallback=shifted,ascii cmd+shift+d discard_event

# Copy the last command's output, replacing the user's cmd+shift+c in kitmux
# tabs (kitty's @last_cmd_output finds nothing inside tmux).
map --when-focus-on var:kitmux_target --allow-fallback=shifted,ascii cmd+shift+c kitmux_bg _copylast @active-kitty-window-id
map --when-focus-on var:kitmux_overlay --allow-fallback=shifted,ascii cmd+shift+c discard_event
